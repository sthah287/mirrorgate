services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mirrorgate
      POSTGRES_PASSWORD: mirrorgate
      POSTGRES_DB: mirrorgate
    ports:
      # 5433 on the host so it doesn't clash with a local Postgres install
      - "5433:5432"
    volumes:
      # Whole directory: the entrypoint runs the files in name order, so
      # init-app-databases.sql creates the two app databases first.
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirrorgate -d mirrorgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redpanda speaks the Kafka protocol but runs as a single container with no
  # ZooKeeper, which matters when six other services share a laptop.
  redpanda:
    image: redpandadata/redpanda:v25.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Containers reach the broker on redpanda:9092, the host on localhost:19092.
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # 16686 is the UI, 4318 is where the services send spans over OTLP/HTTP.
      - "16686:16686"
      - "4318:4318"

  # Stand-in for the payment provider and email sender. Live endpoints for
  # stable, sandbox endpoints for the candidate, and it records every call so
  # a test can prove shadow writes never reached the live ones.
  mock-external:
    build:
      context: services/mock-external
    environment:
      PORT: "9003"
    ports:
      - "9003:9003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9003/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  stable-service:
    build:
      context: .
      dockerfile: services/stable/Dockerfile
    environment:
      PORT: "9001"
      ORDERS_DATABASE_URL: postgres://mirrorgate:mirrorgate@postgres:5432/stable_app?sslmode=disable
      PAYMENTS_URL: http://mock-external:9003/payments/charge
      EMAIL_URL: http://mock-external:9003/notifications/email
      OTEL_SERVICE_NAME: stable-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    ports:
      - "9001:9001"
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
      mock-external:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  candidate-service:
    build:
      context: .
      dockerfile: services/candidate/Dockerfile
    environment:
      PORT: "9002"
      # Sandbox wiring: its own database, the sandbox endpoints of the mock
      # external services, and writes are refused unless they are shadow
      # traffic from the gateway.
      ORDERS_DATABASE_URL: postgres://mirrorgate:mirrorgate@postgres:5432/candidate_sandbox?sslmode=disable
      PAYMENTS_URL: http://mock-external:9003/sandbox/payments/charge
      EMAIL_URL: http://mock-external:9003/sandbox/notifications/email
      REQUIRE_SHADOW_HEADER: "true"
      OTEL_SERVICE_NAME: candidate-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    ports:
      - "9002:9002"
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
      mock-external:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: "8080"
      ADMIN_PORT: "8081"
      STABLE_URL: http://stable-service:9001
      CANDIDATE_URL: http://candidate-service:9002
      STABLE_VERSION: v1
      CANDIDATE_VERSION: v2
      DATABASE_URL: postgres://mirrorgate:mirrorgate@postgres:5432/mirrorgate?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      SHADOW_TIMEOUT: 2s
      MIRROR_METHODS: ${MIRROR_METHODS:-GET,POST}
      MAX_SHADOW_IN_FLIGHT: ${MAX_SHADOW_IN_FLIGHT:-100}
      # Overridable so one experiment run can change strategy without editing
      # this file: SAMPLING_MODE=random SAMPLING_RATE=0.25 docker compose up -d gateway
      SAMPLING_MODE: ${SAMPLING_MODE:-full}
      SAMPLING_RATE: ${SAMPLING_RATE:-}
      SAMPLING_RULES: ${SAMPLING_RULES:-}
      # Risk mode only: how far back the risk signals look and how often the
      # gateway re-reads them from Postgres.
      RISK_WINDOW: ${RISK_WINDOW:-10m}
      RISK_REFRESH: ${RISK_REFRESH:-5s}
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Fixed budget so every experiment run gets the same resources. The
    # machine has 16 CPUs, so these limits are what the experiment compares
    # strategies under, not a limit the laptop imposes.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      stable-service:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/internal/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  comparison-worker:
    build:
      context: .
      dockerfile: comparison-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://mirrorgate:mirrorgate@postgres:5432/mirrorgate?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      KAFKA_GROUP: mirrorgate-comparison-worker
      # Fields that differ by design rather than because something broke:
      # the three generated ones on every order, and the version string the
      # two services report on /health. Without these, every order and every
      # health check would be reported as a difference.
      COMPARE_IGNORE_FIELDS: order_id,created_at,payment_reference,version
      COMPARE_SLOW_THRESHOLD_MS: "200"
      OTEL_SERVICE_NAME: comparison-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy

  # Runs every module's tests without needing Go installed locally:
  #   docker compose run --rm tests
  # The tests/ module talks to the running stack, so the gateway has to be up.
  tests:
    image: golang:1.25-alpine
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
    environment:
      TEST_GATEWAY_URL: http://gateway:8080
      TEST_ADMIN_URL: http://gateway:8081
      TEST_STABLE_URL: http://stable-service:9001
      TEST_CANDIDATE_URL: http://candidate-service:9002
      TEST_MOCK_URL: http://mock-external:9003
    command: sh /src/scripts/run-tests.sh
    depends_on:
      gateway:
        condition: service_healthy
      comparison-worker:
        condition: service_started
      stable-service:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
      mock-external:
        condition: service_healthy

  # k6 load generator for the sampling experiment. The script path lives here
  # rather than on the command line because Git Bash on Windows rewrites a
  # bare /scripts/... argument into a Windows path before Docker sees it.
  #   ./experiments/run.sh
  k6:
    image: grafana/k6:0.55.0
    profiles: ["test"]
    command: ["run", "/scripts/sampling.js"]
    volumes:
      - ./experiments:/scripts
      - ./results:/results
    environment:
      GATEWAY_URL: http://gateway:8080

  # The midterm workload, which adds the order POST to the week 5 mix.
  #   ./experiments/run-midterm.sh
  k6-midterm:
    image: grafana/k6:0.55.0
    profiles: ["test"]
    command: ["run", "/scripts/midterm.js"]
    volumes:
      - ./experiments:/scripts
      - ./results:/results
    environment:
      GATEWAY_URL: http://gateway:8080

volumes:
  pgdata:
  redpandadata:
  gomod:
