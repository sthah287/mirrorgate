server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Same-origin proxy to the gateway's admin port, so the browser never
    # needs to know the gateway address and there's no CORS setup.
    location /internal/ {
        proxy_pass http://gateway:8081;
    }
}
